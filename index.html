<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#101828;--mut:#5b667a;--line:#dfe4ee;--acc:#3446ff;--acc-ink:#fff;--ok:#0f9d6b;--r:16px}

*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 calc(84px + env(safe-area-inset-bottom,0))}

button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{padding:26px 0 18px}
.hero h1{font-size:clamp(30px,7vw,46px);line-height:1.02;font-weight:800}
.hero p{margin:8px 0 16px;color:var(--mut)}
.meter{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.meter b{font:800 26px "Bricolage Grotesque",sans-serif}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--mut);font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}

.tags{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700}
.rail{position:relative;margin-left:8px;padding-left:22px;border-left:3px solid var(--line)}
.slot{position:relative;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:var(--r);padding:12px 14px;margin:0 0 10px;display:flex;gap:12px;align-items:flex-start}
.slot::before{content:"";position:absolute;left:-33px;top:18px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
.slot.done::before{background:var(--ok);border-color:var(--ok)}
.slot.now{box-shadow:0 0 0 3px var(--acc);}
.slot.now::before{border-color:var(--acc);background:var(--acc);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 25%,transparent)}
.slot .b{flex:1;min-width:0}.time{font-size:12.5px;color:var(--mut);font-weight:500}
.chip{display:inline-block;margin:2px 0;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c,#888) 40%,var(--card));color:var(--ink)}
.slot h3{font-size:17px;line-height:1.2;margin:2px 0}.slot p{margin:0;color:var(--mut);font-size:13.5px}
.slot.done h3,.slot.done p{opacity:.55;text-decoration:line-through}
.slot.lunch{border-style:dashed;background:transparent;padding:8px 14px}.slot.lunch h3{font-size:15px}
.slot.night{background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.slot.sec{background:color-mix(in srgb,var(--c) 9%,var(--card))}
.chk{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:18px;font-weight:800;color:transparent}
.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs{display:flex;gap:6px;margin:6px 0 14px;overflow-x:auto}
.tabs button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;white-space:nowrap;padding:0 12px}
.tabs .on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.day{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:grid;gap:6px}
.day.today{box-shadow:0 0 0 3px var(--acc)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:4px;background:var(--c)}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px;display:grid;gap:8px;border-left:6px solid var(--c)}summary::-webkit-details-marker{display:none}
summary h3{font-size:18px;display:flex;justify-content:space-between}
.tp{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:6px}.tp span{font-size:14px}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}.pill button{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:12.5px}
.pill .on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.tbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0));display:flex;gap:8px;justify-content:center}
.tbar button{flex:1;max-width:220px;min-height:48px;border-radius:14px;border:0;background:transparent;font-weight:700;color:var(--mut)}
.tbar .on{background:var(--acc);color:var(--acc-ink)}
.reset{margin:20px 0;width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const WD=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],MO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const GN=Object.fromEntries(D.groups.map(g=>[g.k,g]));
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fd=s=>{const d=pd(s);return d.getDate()+" "+MO[d.getMonth()]};
let now=new Date(),iso='';const tick=()=>{now=new Date();iso=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`};tick();
const chk=d=>d.slots.filter(s=>s.k!=='lunch');
const allS=D.days.flatMap(chk),total=allS.length;
let st={v:'hoje',i:Math.max(0,D.days.findIndex(d=>d.date>=iso)),w:0,first:true};
if(iso>D.days[D.days.length-1].date)st.i=D.days.length-1;
const cnt=d=>chk(d).filter(s=>done[s.id]).length;
const KL={new:g=>GN[g].n,sec:g=>'2ª volta · '+GN[g].n,q:g=>'Questões · '+GN[g].n,rev:()=>'Revisão',gym:()=>'Academia',org:()=>'Organização',free:()=>'Revisão livre',red:()=>'Redação',night:()=>'Noite',sim:()=>'Simulado'};
function isNow(s,d){if(d.date!==iso)return false;const m=s.t.match(/(\d\d):(\d\d)–(\d\d):(\d\d)/);if(!m)return false;const n=now.getHours()*60+now.getMinutes();return n>=+m[1]*60+ +m[2]&&n<=+m[3]*60+ +m[4]}
function slot(s,d){
 if(s.k==='lunch')return`<div class="slot lunch"><div class="b"><span class="time">${s.t}</span><h3>${s.c}</h3></div></div>`;
 const c=s.g?GN[s.g].c:(s.k==='gym'?'#34c58a':s.k==='red'?'#ff6fa5':s.k==='sim'?'#f2b705':'#9aa5b8');
 return`<div class="slot ${s.k} ${done[s.id]?'done':''} ${isNow(s,d)?'now':''}" style="--c:${c}"><div class="b"><div class="time">${s.t}</div><span class="chip">${KL[s.k](s.g)}</span><h3>${s.c}</h3><p>${s.n}</p></div><button class="chk" data-a="tog" data-id="${s.id}" aria-label="Marcar como feito" aria-pressed="${!!done[s.id]}">✓</button></div>`}
function hoje(){const d=D.days[st.i],p=cnt(d),n=chk(d).length,dt=pd(d.date);

 return`<div class="nav"><button class="ib" data-a="go" data-i="${st.i-1}" aria-label="Dia anterior" ${st.i?'':'disabled'}>‹</button><h2>${WD[dt.getDay()]}, ${fd(d.date)}<small>Semana ${d.w+1} · ${p} de ${n} feitos</small></h2><button class="ib" data-a="go" data-i="${st.i+1}" aria-label="Próximo dia" ${st.i<D.days.length-1?'':'disabled'}>›</button></div><div class="tags">${tg}</div><div class="rail">${d.slots.map(s=>slot(s,d)).join('')}</div>`}
function semana(){const ds=D.days.map((d,i)=>[d,i]).filter(([d])=>d.w===st.w);
 return`<div class="tabs">${[0,1,2,3].map(w=>`<button class="${w===st.w?'on':''}" data-a="wk" data-w="${w}">Semana ${w+1}</button>`).join('')}</div>`+ds.map(([d,i])=>{const dt=pd(d.date),n=chk(d).length,p=cnt(d);
  const dots=[...new Set(d.slots.filter(s=>s.g&&(s.k==='new'||s.k==='sec')).map(s=>s.g))].map(g=>`<i style="--c:${GN[g].c}" title="${GN[g].n}"></i>`).join('');
  return`<button class="day ${d.date===iso?'today':''}" data-a="go" data-i="${i}" data-open="1"><div class="row"><b style="color:var(--ink);font-size:16px">${WD[dt.getDay()]}, ${fd(d.date)}</b><span>${d.red?'Redação · ':''}${d.sim?'Simulado nº'+d.sim+' · ':''}${Math.round(p/n*100)}%</span></div><div class="dots">${dots}</div><div class="bar"><i style="width:${p/n*100}%"></i></div></button>`}).join('')}
function temas(){return D.groups.map(g=>{const t=D.topics[g.k],ok=t.filter(x=>done[x.s1]).length,rv=t.filter(x=>done[x.s2]).length;
 return`<details style="--c:${g.c}"><summary><h3>${g.n}<span style="font-size:13px;color:var(--mut);font-weight:500">${ok}/${t.length} estudados · ${rv} revisados</span></h3><div class="bar"><i style="width:${ok/t.length*100}%"></i></div></summary>${t.map(x=>`<div class="tp"><span><b>T${x.i}</b> ${x.n} <small style="color:var(--mut)">(${x.a})</small></span><div class="pill"><button class="${done[x.s1]?'on':''}" data-a="tog" data-id="${x.s1}">Estudo ${fd(x.d1)}</button><button class="${done[x.s2]?'on':''}" data-a="tog" data-id="${x.s2}">Revisão ${fd(x.d2)}</button></div></div>`).join('')}</details>`}).join('')+`<button class="reset" data-a="reset">Limpar todo o progresso</button>`}
function render(){const nd=Object.keys(done).filter(k=>done[k]).length,left=Math.max(0,Math.ceil((pd(D.days[D.days.length-1].date)-pd(iso))/864e5));
 const V={hoje,semana,temas}[st.v]();
 document.getElementById('app').innerHTML=`<header class="hero"><h1>Revisão Fuvest, 4 semanas</h1><p>28 set a 25 out · ${iso<=D.days[D.days.length-1].date&&iso>=D.days[0].date?`faltam ${left} dias para o último simulado`:'seu plano completo, do primeiro ao último dia'}</p><div class="meter"><div class="row"><span><b>${Math.round(nd/total*100)}%</b> do cronograma feito</span><span>${nd} de ${total} blocos</span></div><div class="bar"><i style="width:${nd/total*100}%"></i></div></div></header><main>${V}</main><nav class="tbar" aria-label="Seções">${[['hoje','Dia'],['semana','Semanas'],['temas','Temas']].map(([k,l])=>`<button class="${st.v===k?'on':''}" data-a="view" data-v="${k}">${l}</button>`).join('')}</nav>`;
 if(st.first&&st.v==='hoje'){st.first=false;const n=document.querySelector('.slot.now');if(n)n.scrollIntoView({block:'center'})}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,y=scrollY;
 if(a==='tog'){done[b.dataset.id]=!done[b.dataset.id];save()}
 if(a==='go'){st.i=+b.dataset.i;if(b.dataset.open)st.v='hoje'}
 if(a==='wk')st.w=+b.dataset.w;if(a==='view'){st.v=b.dataset.v;if(st.v==='semana')st.w=D.days[st.i].w}
 if(a==='reset'){if(confirm('Apagar todo o progresso?')){done={};save()}}
 const open=[...document.querySelectorAll('details[open] h3')].map(h=>h.firstChild.textContent);render();
 document.querySelectorAll('details').forEach(d=>{if(open.includes(d.querySelector('h3').firstChild.textContent))d.open=true});
 scrollTo(0,a==='go'||a==='view'||a==='wk'?0:y)});
render();setInterval(()=>{tick();if(st.v==='hoje'&&!document.hidden){const y=scrollY;render();scrollTo(0,y)}},6e4);
</script></body></html>
